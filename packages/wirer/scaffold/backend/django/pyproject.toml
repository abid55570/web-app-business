[project]
name = "spike-backend"
version = "0.1.0"
description = "Django backend (generated by b-dash)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
]

[tool.setuptools.packages.find]
include = ["config*", "auth_core*", "auth_jwt*", "auth_oauth*", "menu*", "orders*", "notifications*", "events_bus*", "payment_fake*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
# Discover both `tests/` (cross-cutting) and `<app>/tests/` (per-app). Django
# convention puts unit tests next to the app so we don't enforce a single root.
python_files = ["test_*.py"]
