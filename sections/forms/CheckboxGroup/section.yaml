id: CheckboxGroup
displayName: "Checkbox group (card style)"
description: "Stacked card-styled checkbox list with per-option description text."
version: 1.0.0

category: forms
density: comfortable
responsive: mobile-first

componentFile: ./CheckboxGroup.tsx

props:
  name:
    type: string
    label: "Form field name"
