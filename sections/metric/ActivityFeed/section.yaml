id: ActivityFeed
displayName: "Activity feed"
description: "Event timeline — user actions / audit log / changelog stream."
version: 1.0.0

category: metric
density: comfortable
responsive: mobile-first

componentFile: ./ActivityFeed.tsx

props:
  heading:
    type: string
    label: "Heading"
    default: "Recent activity"
