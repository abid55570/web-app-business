id: FeaturesStagger
displayName: "Features — staggered framer reveals"
description: "Grid of feature cards that fade + slide in stagger as they enter the viewport. Gradient accent borders, glass background."
version: 1.0.0

category: features
density: comfortable
responsive: mobile-first

componentFile: ./FeaturesStagger.tsx

props:
  eyebrow: { type: string, label: "Eyebrow" }
  headline: { type: string, label: "Headline", required: true }
  body: { type: string, label: "Body", multiline: true }
  accentColor: { type: color, label: "Accent color", default: "#6366f1" }
  features:
    type: array
    label: "Feature cards"
    required: true
    description: "{ icon, title, body }"

  layoutVariant:
    type: string
    label: "Layout"
    default: "3col"
    options: [3col, 2col, list, 4col]

variants:
  - id: 3col
    label: "3 columns"
    description: "Three features side by side (default)"
  - id: 2col
    label: "2 columns"
    description: "Two wider feature cards per row"
  - id: 4col
    label: "4 columns"
    description: "Four compact feature cards per row"
  - id: list
    label: "Single column"
    description: "Stacked vertically — best for long descriptions"

tags: [features, premium, framer-motion]
bestWithThemes: [aurora, glass]
deprecated: false
