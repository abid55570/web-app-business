id: FeatureSlider
displayName: "Feature slider (radio-driven)"
description: "Pure-CSS feature slider — one feature at a time, dot navigation, image-left/text-right layout."
version: 1.0.0

category: features
density: comfortable
responsive: mobile-first

componentFile: ./FeatureSlider.tsx

props:
  heading:
    type: string
    label: "Section heading"
