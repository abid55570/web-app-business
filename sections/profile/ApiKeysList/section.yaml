    type: string
    label: "POST URL to create a key"
    required: true
  revokeAction:
    type: string
    label: "POST URL prefix to revoke (id appended)"
    required: true

tags: [profile, api, security]
bestWithThemes: [terminal, mono, corporate-blue]
deprecated: false
