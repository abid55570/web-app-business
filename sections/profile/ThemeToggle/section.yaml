id: ThemeToggle
displayName: "Theme toggle (light/dark/system)"
description: "3-segment pill: light, dark, system. POSTs `theme` field — server can persist + emit cookie/header."
version: 1.0.0

category: profile
density: compact
responsive: mobile-first

componentFile: ./ThemeToggle.tsx

props:
