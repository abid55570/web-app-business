id: VideoModal
displayName: "Video lightbox modal"
description: "Trigger button opens a centered iframe video modal (YouTube/Vimeo/Loom). :target-driven."
version: 1.0.0

category: modal
density: comfortable
responsive: mobile-first

componentFile: ./VideoModal.tsx

props:
  id:
    type: string
    label: "Modal DOM id"
    required: true
  triggerLabel:
    type: string
