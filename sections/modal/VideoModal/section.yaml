  embedUrl:
    type: string
    label: "Iframe embed URL"
    required: true
  title:
    type: string
    label: "Video title (a11y)"
    required: true

tags: [modal, video, lightbox]
bestWithThemes: [glass, sunset, minimal]
deprecated: false
