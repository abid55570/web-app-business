id: CtaBookCard
displayName: "Book-a-consultation card (full)"
description: "Two-side card — features + sales pitch on left, duration + host + booking button on right."
version: 1.0.0

category: cta
density: spacious
responsive: mobile-first

componentFile: ./CtaBookCard.tsx

props:
  badge:
    type: string
    label: "Badge label"
    default: "Free consultation"
  title:
    type: string
    label: "Title"
    required: true
  body:
    type: string
    label: "Body"
    required: true
  features:
    type: array
    label: "Feature bullets"
    required: true
  bookingHref:
    type: string
    label: "Booking URL"
    required: true
  bookingLabel:
    type: string
    label: "Button label"
    default: "Book your slot"
  durationMinutes:
    type: number
    label: "Duration (min)"
  hostName:
    type: string
    label: "Host name"

tags: [cta, booking, sales]
bestWithThemes: [corporate-blue, glass, sapphire]
deprecated: false
