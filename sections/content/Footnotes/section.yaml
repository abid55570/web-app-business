id: Footnotes
displayName: "Footnotes list (with back-links)"
description: "Numbered footnotes block — each entry has a back-link to its in-body reference (#fnref-<id>)."
version: 1.0.0

category: content
density: comfortable
responsive: mobile-first

componentFile: ./Footnotes.tsx

props:
  heading:
    type: string
    label: "Heading"
    default: "Notes"
  footnotes:
    type: array
    label: "Footnotes"
    required: true
    description: "{ id, body }"

tags: [content, footnotes, citation]
bestWithThemes: [editorial, mono, ivory]
deprecated: false
