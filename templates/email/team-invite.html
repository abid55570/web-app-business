<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>You've been invited</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .who { background: #f4f4f5; border-radius: 8px; padding: 16px 18px; margin: 16px 0; }
    .role { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #dbeafe; color: #1e40af; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Join {{workspace.name}} on {{branding.name}}</h1>
      <p><strong>{{inviter.name}}</strong> has invited you to collaborate.</p>
      <div class="who">
        <p style="margin:0 0 6px">Role: <span class="role">{{invite.role}}</span></p>
        <p style="margin:0;color:#666;font-size:13px">{{invite.message}}</p>
      </div>
      <p><a class="button" href="{{invite.acceptUrl}}">Accept invite →</a></p>
      <p style="color:#666;font-size:12px;margin-top:18px">Invitation expires {{invite.expiresAt}}.</p>
    </div>
    <p class="footer">{{branding.name}}</p>
  </div>
</body>
</html>
