<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>You're in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 36px 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); text-align: center; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #f3e8ff; color: #6b21a8; margin-bottom: 14px; }
    .code { display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #f4f4f5; padding: 10px 18px; border-radius: 8px; font-size: 18px; letter-spacing: 2px; font-weight: 700; margin: 16px 0; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 700; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
    .footer a { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Early access</span>
      <h1>{{customer.name}}, your early-access spot is ready</h1>
      <p>You were #{{waitlist.position}} of {{waitlist.total}}. Use this code on sign-up:</p>
      <p class="code">{{access.code}}</p>
      <p><a class="button" href="{{access.url}}">Activate access →</a></p>
      <p style="color:#666;font-size:12px;margin-top:14px">Code expires {{access.expiresAt}}.</p>
    </div>
    <p class="footer">
      {{branding.name}} · <a href="{{branding.unsubscribeUrl}}">unsubscribe</a>
    </p>
  </div>
</body>
</html>
