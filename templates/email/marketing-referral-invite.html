<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>You've been invited</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); text-align: center; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .reward { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; background: {{branding.primary}}; color: #fff; margin: 12px 0 20px; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; }
    .code { display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #f4f4f5; padding: 10px 16px; border-radius: 8px; font-size: 16px; letter-spacing: 2px; font-weight: 700; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
    .footer a { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>{{referrer.name}} invited you</h1>
      <p>to try {{branding.name}}.</p>
      <p class="reward">Claim {{reward.label}}</p>
      <p>Use this code on signup:</p>
      <p class="code">{{referral.code}}</p>
      <p style="margin-top:20px"><a class="button" href="{{referral.acceptUrl}}">Accept invite →</a></p>
      <p style="color:#666;font-size:12px;margin-top:24px">Expires {{referral.expiresAt}}.</p>
    </div>
    <p class="footer">
      {{branding.name}} · <a href="{{branding.unsubscribeUrl}}">unsubscribe</a>
    </p>
  </div>
</body>
</html>
