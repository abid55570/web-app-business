<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Your {{year.label}} year in review</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: linear-gradient(135deg, {{branding.primary}}, #111); color: #fff; border-radius: 16px; padding: 36px 28px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    .year { font-size: 64px; font-weight: 900; line-height: 1; margin: 8px 0 16px; opacity: .92; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
    .stat { background: rgba(255,255,255,.12); border-radius: 12px; padding: 16px 8px; }
    .stat-value { font-size: 22px; font-weight: 700; }
    .stat-label { font-size: 11px; opacity: .8; text-transform: uppercase; letter-spacing: .05em; }
    .milestone { margin-top: 16px; font-size: 14px; opacity: .9; font-style: italic; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
    .footer a { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>{{user.name}}, your year was big.</h1>
      <p class="year">{{year.label}}</p>
      <div class="stats">
        {{#year.stats}}<div class="stat"><div class="stat-value">{{value}}</div><div class="stat-label">{{label}}</div></div>{{/year.stats}}
      </div>
      <p class="milestone">{{year.topMilestone}}</p>
    </div>
    <p class="footer">{{branding.name}} · <a href="{{branding.unsubscribeUrl}}">unsubscribe</a></p>
  </div>
</body>
</html>
