<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>New podcast episode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    .hero { display: flex; gap: 16px; padding: 24px; align-items: center; background: linear-gradient(135deg, {{branding.primary}} 0%, #581c87 100%); color: #fff; }
    .hero img { width: 96px; height: 96px; border-radius: 8px; object-fit: cover; flex: none; }
    .hero h1 { margin: 0 0 4px; font-size: 18px; }
    .hero p { margin: 0; opacity: .9; font-size: 13px; }
    .body { padding: 24px; }
    .platforms { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .platform { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; background: #f4f4f5; border-radius: 8px; text-decoration: none; color: #111; font-size: 12px; font-weight: 600; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 700; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
    .footer a { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="hero">
        <img src="{{episode.coverUrl}}" alt="" />
        <div>
          <h1>{{episode.title}}</h1>
          <p>Episode {{episode.number}} · {{episode.durationLabel}}</p>
        </div>
      </div>
      <div class="body">
        <p>{{episode.summary}}</p>
        <p style="text-align:center;margin-top:18px"><a class="button" href="{{episode.url}}">Listen now →</a></p>
        <div class="platforms">
          <a class="platform" href="{{episode.spotifyUrl}}">🎵 Spotify</a>
          <a class="platform" href="{{episode.appleUrl}}"> Apple</a>
          <a class="platform" href="{{episode.youtubeUrl}}">▶ YouTube</a>
        </div>
      </div>
    </div>
    <p class="footer">
      {{branding.name}} · <a href="{{branding.unsubscribeUrl}}">unsubscribe</a>
    </p>
  </div>
</body>
</html>
