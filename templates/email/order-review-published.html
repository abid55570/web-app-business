<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Your review is live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #ecfdf5; color: #047857; margin-bottom: 12px; }
    .stars { font-size: 22px; color: #f59e0b; }
    blockquote { background: #f4f4f5; border-left: 3px solid {{branding.primary}}; padding: 14px 18px; margin: 16px 0; font-style: italic; color: #111; border-radius: 0 8px 8px 0; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Review live</span>
      <h1>Thanks for reviewing {{product.name}}, {{customer.name}}</h1>
      <p>Your review is published and helping other shoppers right now.</p>
      <p class="stars">{{review.starsRendered}}</p>
      <blockquote>{{review.body}}</blockquote>
      <p>{{review.helpfulCount}} people found it helpful so far.</p>
      <p><a class="button" href="{{review.url}}">View live review</a></p>
    </div>
    <p class="footer">{{branding.name}}</p>
  </div>
</body>
</html>
