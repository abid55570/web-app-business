<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>How was it?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 36px 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); text-align: center; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    .stars { display: inline-block; margin: 8px 0 24px; }
    .stars a { display: inline-block; font-size: 32px; color: #d4d4d8; text-decoration: none; padding: 0 4px; }
    .stars a:hover { color: #f59e0b; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
    .footer a { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>How was {{purchase.label}}, {{customer.name}}?</h1>
      <p>Tap a star to share quick feedback:</p>
      <p class="stars">
        <a href="{{review.url}}?stars=1" aria-label="1 star">★</a>
        <a href="{{review.url}}?stars=2" aria-label="2 stars">★</a>
        <a href="{{review.url}}?stars=3" aria-label="3 stars">★</a>
        <a href="{{review.url}}?stars=4" aria-label="4 stars">★</a>
        <a href="{{review.url}}?stars=5" aria-label="5 stars">★</a>
      </p>
      <p>Or leave a full review:</p>
      <p><a class="button" href="{{review.url}}">Write a review</a></p>
    </div>
    <p class="footer">
      {{branding.name}} · <a href="{{branding.unsubscribeUrl}}">unsubscribe</a>
    </p>
  </div>
</body>
</html>
