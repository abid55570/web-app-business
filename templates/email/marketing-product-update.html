<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{release.title}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    .release-tag { display: inline-block; background: #eef2ff; color: #4338ca; font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    h1 { margin: 12px 0; font-size: 24px; }
    .feature { margin: 16px 0; padding: 12px; background: #f9fafb; border-radius: 8px; }
    .feature h3 { margin: 0 0 4px; font-size: 15px; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 12px; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="release-tag">v{{release.version}}</span>
      <h1>{{release.title}}</h1>
      <p>{{release.intro}}</p>
      {{#each release.features}}
      <div class="feature">
        <h3>{{name}}</h3>
        <p>{{description}}</p>
      </div>
      {{/each}}
      <a class="button" href="{{release.detailsUrl}}">See all changes</a>
    </div>
    <p class="footer">{{branding.name}} · <a href="{{branding.unsubscribeUrl}}">Manage emails</a></p>
  </div>
</body>
</html>
