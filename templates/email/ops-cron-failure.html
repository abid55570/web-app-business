<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Scheduled job failed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); border-top: 6px solid #dc2626; }
    h1 { margin: 0 0 12px; font-size: 22px; color: #991b1b; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #fee2e2; color: #991b1b; margin-bottom: 12px; }
    .meta { background: #f4f4f5; border-radius: 8px; padding: 14px 18px; margin: 16px 0; font-size: 13px; }
    .meta dt { color: #666; font-weight: 500; }
    .meta dd { margin: 0 0 6px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre.err { background: #0a0a0a; color: #fca5a5; border-radius: 8px; padding: 14px; overflow-x: auto; font-size: 12px; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Cron failed</span>
      <h1>{{job.name}} failed at {{job.failedAt}}</h1>
      <dl class="meta">
        <dt>Schedule</dt><dd>{{job.cron}}</dd>
        <dt>Exit code</dt><dd>{{job.exitCode}}</dd>
        <dt>Duration</dt><dd>{{job.durationMs}}ms</dd>
        <dt>Retry #</dt><dd>{{job.attemptNumber}} of {{job.maxRetries}}</dd>
      </dl>
      <p style="margin:14px 0 6px;font-weight:600">Last 200 chars of stderr:</p>
      <pre class="err">{{job.stderrTail}}</pre>
      <p style="margin-top:16px"><a class="button" href="{{job.logsUrl}}">Open full logs</a></p>
    </div>
    <p class="footer">{{branding.name}}</p>
  </div>
</body>
</html>
