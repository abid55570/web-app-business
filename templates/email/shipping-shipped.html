<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Your order has shipped</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .meta { background: #f4f4f5; border-radius: 8px; padding: 14px 18px; margin: 16px 0; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Your order is on the way 📦</h1>
      <p>Hi {{customer.name}},</p>
      <p>Order <strong>#{{order.id}}</strong> has shipped via <strong>{{shipment.carrier}}</strong>.</p>
      <div class="meta">
        <p><strong>Tracking:</strong> <a href="{{shipment.trackingUrl}}">{{shipment.trackingNumber}}</a></p>
        <p><strong>Estimated arrival:</strong> {{shipment.eta}}</p>
        <p><strong>Shipping to:</strong> {{shipment.address}}</p>
      </div>
      <p><a class="button" href="{{order.viewUrl}}">View your order</a></p>
    </div>
    <p class="footer">{{branding.name}} · Questions? Reply to this email.</p>
  </div>
</body>
</html>
