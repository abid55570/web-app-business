<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Order delivered</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .hero { background: #ecfdf5; color: #047857; padding: 14px 18px; border-radius: 8px; font-weight: 600; margin: 0 0 18px; }
    .meta { background: #f4f4f5; border-radius: 8px; padding: 14px 18px; margin: 16px 0; font-size: 13px; }
    .meta dt { color: #666; font-weight: 500; }
    .meta dd { margin: 0 0 6px; font-weight: 600; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <p class="hero">Delivered on {{delivery.deliveredAt}}</p>
      <h1>Your order arrived, {{customer.name}}</h1>
      <p>Order <strong>#{{order.id}}</strong> was delivered to {{delivery.address}}.</p>
      <dl class="meta">
        <dt>Carrier</dt><dd>{{shipment.carrier}}</dd>
        <dt>Tracking</dt><dd>{{shipment.trackingNumber}}</dd>
      </dl>
      <p>Something off? <a href="{{branding.supportUrl}}">Contact support</a> within 14 days.</p>
      <p><a class="button" href="{{order.reviewUrl}}">Leave a review</a></p>
    </div>
    <p class="footer">{{branding.name}}</p>
  </div>
</body>
</html>
