<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Your verification code</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); text-align: center; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .code { display: inline-block; font: 700 36px/1 ui-monospace, 'SFMono-Regular', monospace; letter-spacing: 0.3em; padding: 18px 24px; background: #f4f4f5; border-radius: 12px; margin: 16px 0; color: #111; }
    .meta { color: #666; font-size: 13px; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Your verification code</h1>
      <p>Use this code to finish signing in to {{branding.name}}:</p>
      <p class="code">{{otp.code}}</p>
      <p class="meta">Expires in {{otp.expiresInMinutes}} minutes.<br/>If you didn't try to sign in, ignore this email.</p>
    </div>
    <p class="footer">{{branding.name}} · Two-factor authentication</p>
  </div>
</body>
</html>
