<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Coupon expires soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 36px 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); text-align: center; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #fef3c7; color: #92400e; margin-bottom: 14px; }
    .code { display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #f4f4f5; padding: 12px 22px; border-radius: 8px; font-size: 22px; letter-spacing: 2px; font-weight: 700; margin: 12px 0 18px; }
    .countdown { color: #c2410c; font-weight: 700; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 700; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Coupon expiring</span>
      <h1>Use {{coupon.label}} before it expires</h1>
      <p class="countdown">Expires in {{coupon.hoursLeft}} hours</p>
      <p class="code">{{coupon.code}}</p>
      <p style="margin:0 auto;max-width:340px;color:#666;font-size:13px">{{coupon.description}}</p>
      <p style="margin-top:18px"><a class="button" href="{{coupon.redeemUrl}}">Redeem now →</a></p>
    </div>
    <p class="footer">{{branding.name}}</p>
  </div>
</body>
</html>
