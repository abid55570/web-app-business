<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{product.name}} is back in stock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.04); text-align: center; }
    .hero img { width: 100%; height: auto; display: block; }
    .body { padding: 28px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .stock { display: inline-block; background: #ecfdf5; color: #047857; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-bottom: 14px; }
    .price { font-size: 22px; font-weight: 700; color: {{branding.primary}}; margin: 8px 0 16px; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 700; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
    .footer a { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="hero"><img src="{{product.imageUrl}}" alt="" /></div>
      <div class="body">
        <p class="stock">Back in stock</p>
        <h1>{{product.name}}</h1>
        <p class="price">{{product.price}}</p>
        <p>You asked us to let you know — {{product.stockLeft}} now available.</p>
        <p style="margin-top:18px"><a class="button" href="{{product.url}}">Buy now →</a></p>
      </div>
    </div>
    <p class="footer">
      {{branding.name}} · <a href="{{branding.unsubscribeUrl}}">unsubscribe</a>
    </p>
  </div>
</body>
</html>
