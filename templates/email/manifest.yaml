# Email template registry — handlebars-style {{var}} placeholders.
# Phase 5 wave 1 ships 3 transactional starters; wave 2 adds marketing.
#
# Notification adapters resolve template name → file path via this map.
# `vars` documents the substitution surface so wirer can validate at
# render-prep time that the caller is passing every required key.

templates:
  - id: order.placed
    file: ./order-confirmation.html
    description: "Sent when a customer places an order (orders.placed event)."
    vars:
      required:
        - branding.name
        - branding.primary
        - customer.name
        - order.id
        - order.createdAt
        - order.paymentStatus
        - order.items
        - order.total
        - order.currency
        - order.viewUrl

  - id: auth.password-reset
    file: ./password-reset.html
    description: "Sent when a user requests a password reset link."
    vars:
      required:
        - branding.name
        - branding.primary
        - user.name
        - token.url
        - token.expiresInMinutes
        - request.ip
        - request.timestamp

  - id: auth.welcome
    file: ./welcome.html
    description: "Sent on first signup confirmation."
    vars:
      required:
        - branding.name
        - branding.primary
        - user.name
        - user.confirmUrl
        - user.dashboardUrl
        - branding.unsubscribeUrl

  - id: billing.invoice
    file: ./invoice.html
    description: "Issued when an invoice is finalised (subscription renewal, milestone delivery, etc.)."
    vars:
      required:
        - branding.name
        - branding.primary
        - branding.address
        - branding.supportUrl
        - invoice.number
        - invoice.issuedAt
        - invoice.dueAt
        - invoice.lines
        - invoice.subtotal
        - invoice.total
        - invoice.currency
        - invoice.payUrl
        - customer.name
        - customer.email

  - id: ops.alert
    file: ./alert.html
    description: "Generic operational alert (severity-coded, optional context dictionary, optional action button)."
    vars:
      required:
        - branding.name
        - branding.primary
        - alert.severity
        - alert.title
        - alert.body
        - alert.color
        - alert.timestamp

  - id: shipping.shipped
    file: ./shipping-shipped.html
