<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>We miss you</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 36px 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); text-align: center; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .gone { color: #888; font-size: 14px; margin: 0 0 24px; }
    .perk { background: {{branding.primary}}; color: #fff; padding: 14px 20px; border-radius: 999px; display: inline-block; font-weight: 700; margin: 8px 0 24px; }
    .button { display: inline-block; background: #111; color: #fff; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 700; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
    .footer a { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>We miss you, {{customer.name}}</h1>
      <p class="gone">It's been {{returning.daysAway}} days since your last visit.</p>
      <p>Come back and we'll throw in something special:</p>
      <p class="perk">{{perk.label}}</p>
      <p><a class="button" href="{{returning.url}}">Sign me back in →</a></p>
      <p style="color:#888;font-size:12px;margin-top:18px">Offer expires {{perk.expiresAt}}.</p>
    </div>
    <p class="footer">
      {{branding.name}} · <a href="{{branding.unsubscribeUrl}}">unsubscribe</a>
    </p>
  </div>
</body>
</html>
