<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Your role changed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .change { background: #f4f4f5; border-radius: 8px; padding: 16px 18px; margin: 16px 0; text-align: center; font-size: 16px; }
    .change .from { color: #888; text-decoration: line-through; }
    .change .arrow { margin: 0 12px; color: #888; }
    .change .to { color: {{branding.primary}}; font-weight: 700; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Your role in {{workspace.name}} changed</h1>
      <p>{{actor.name}} updated your access:</p>
      <div class="change">
        <span class="from">{{role.previous}}</span>
        <span class="arrow">→</span>
        <span class="to">{{role.current}}</span>
      </div>
      <p>{{role.summary}}</p>
      <p><a class="button" href="{{workspace.url}}">Open workspace</a></p>
      <p style="color:#666;font-size:12px;margin-top:18px">If you think this was a mistake, reply to this email or contact {{actor.name}}.</p>
    </div>
    <p class="footer">{{branding.name}}</p>
  </div>
</body>
</html>
