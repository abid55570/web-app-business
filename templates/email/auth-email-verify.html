<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Verify your email</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .meta { background: #f4f4f5; border-radius: 8px; padding: 14px 18px; margin: 16px 0; font-size: 13px; color: #555; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Verify your email</h1>
      <p>Hi {{user.name}},</p>
      <p>Click the button to confirm your email address. The link expires in {{verify.expiresInMinutes}} minutes.</p>
      <p style="margin: 24px 0;"><a class="button" href="{{verify.url}}">Verify email</a></p>
      <div class="meta">
        Or paste this link into your browser:<br/>
        <a href="{{verify.url}}">{{verify.url}}</a>
      </div>
      <p>If you didn't sign up for {{branding.name}}, ignore this email.</p>
    </div>
    <p class="footer">{{branding.name}}</p>
  </div>
</body>
</html>
