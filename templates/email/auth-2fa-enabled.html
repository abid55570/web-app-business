<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>2FA enabled</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #ecfdf5; color: #047857; margin-bottom: 12px; }
    .codes { background: #f4f4f5; border-radius: 8px; padding: 14px 18px; margin: 16px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.8; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">2FA enabled</span>
      <h1>Two-factor authentication is now on</h1>
      <p>Hi {{user.name}}, you've added an extra layer of security via {{tfa.method}}.</p>
      <p style="font-weight:600;margin-top:18px">Recovery codes — save these somewhere safe:</p>
      <div class="codes">{{tfa.recoveryCodes}}</div>
      <p style="color:#666;font-size:12px">Each code can be used once if you lose access to your 2FA device.</p>
      <p><a class="button" href="{{tfa.manageUrl}}">Manage 2FA</a></p>
    </div>
    <p class="footer">{{branding.name}}</p>
  </div>
</body>
</html>
