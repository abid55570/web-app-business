<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Deploy rolled back</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); border-top: 6px solid #f59e0b; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #fef3c7; color: #92400e; margin-bottom: 12px; }
    .change { background: #f4f4f5; border-radius: 8px; padding: 16px 18px; margin: 16px 0; text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .change .from { color: #888; text-decoration: line-through; }
    .change .arrow { margin: 0 12px; color: #888; }
    .change .to { color: {{branding.primary}}; font-weight: 700; }
    .meta { background: #f4f4f5; border-radius: 8px; padding: 14px 18px; margin: 16px 0; font-size: 13px; }
    .meta dt { color: #666; font-weight: 500; }
    .meta dd { margin: 0 0 6px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Rollback</span>
      <h1>{{deploy.environment}} rolled back</h1>
      <p>Triggered by {{rollback.actor}} at {{rollback.timestamp}}.</p>
      <div class="change">
        <span class="from">{{rollback.fromVersion}}</span>
        <span class="arrow">←</span>
        <span class="to">{{rollback.toVersion}}</span>
      </div>
      <dl class="meta">
        <dt>Reason</dt><dd>{{rollback.reason}}</dd>
        <dt>Health after</dt><dd>{{rollback.healthStatus}}</dd>
        <dt>Tickets</dt><dd>{{rollback.relatedTickets}}</dd>
      </dl>
      <p><a class="button" href="{{rollback.detailsUrl}}">View incident</a></p>
    </div>
    <p class="footer">{{branding.name}}</p>
  </div>
</body>
</html>
