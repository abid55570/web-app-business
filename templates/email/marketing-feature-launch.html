<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{feature.title}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    .hero { padding: 40px 28px; background: linear-gradient(135deg, {{branding.primary}} 0%, #6366f1 100%); color: #fff; text-align: center; }
    .hero h1 { margin: 0; font-size: 28px; font-weight: 800; }
    .hero p { margin: 8px 0 0; opacity: 0.9; }
    .body { padding: 28px; }
    .body h2 { font-size: 16px; margin: 18px 0 8px; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
    .footer a { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="hero">
        <h1>{{feature.title}}</h1>
        <p>Now live in {{branding.name}}</p>
      </div>
      <div class="body">
        <p>{{feature.body}}</p>
        <h2>What's new</h2>
        <p>{{feature.highlight1}}</p>
        <p>{{feature.highlight2}}</p>
        <p>{{feature.highlight3}}</p>
        <p style="text-align:center;margin-top:24px"><a class="button" href="{{feature.detailsUrl}}">Try it now →</a></p>
      </div>
    </div>
    <p class="footer">
      {{branding.name}} · <a href="{{branding.unsubscribeUrl}}">unsubscribe</a>
    </p>
  </div>
</body>
</html>
