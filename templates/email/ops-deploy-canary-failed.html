<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Canary deploy failed · {{deploy.environment}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #1a1a1a; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #eee; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #262626; border-radius: 10px; padding: 24px; border-left: 4px solid #ef4444; }
    h1 { margin: 0 0 12px; font-size: 18px; color: #ef4444; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #ef4444; color: #fff; margin-bottom: 12px; }
    .meta { background: #1a1a1a; border-radius: 6px; padding: 14px 18px; margin: 14px 0; font-family: 'SFMono-Regular', Menlo, monospace; font-size: 12px; }
    .meta dt { color: #888; }
    .meta dd { margin: 0 0 6px; color: #fff; }
    .reason { background: #3a1010; border-radius: 6px; padding: 12px; margin: 14px 0; font-family: monospace; font-size: 12px; color: #fca5a5; white-space: pre-wrap; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 13px; }
    .footer { color: #666; font-size: 11px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Canary rolled back</span>
      <h1>Canary failed: deploy {{deploy.id}}</h1>
      <dl class="meta">
        <dt>Environment</dt><dd>{{deploy.environment}}</dd>
        <dt>Commit</dt><dd>{{deploy.commitSha}}</dd>
        <dt>Rolled back at</dt><dd>{{deploy.rolledBackAt}}</dd>
      </dl>
      <div class="reason">{{deploy.failureReason}}</div>
      <p><a class="button" href="{{deploy.runbookUrl}}">Open runbook</a></p>
    </div>
    <p class="footer">{{branding.name}} ops alert</p>
  </div>
</body>
</html>
