<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Session expired</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #f4f4f5; color: #525252; margin-bottom: 12px; }
    .meta { background: #f4f4f5; border-radius: 8px; padding: 14px 18px; margin: 16px 0; font-size: 13px; }
    .meta dt { color: #666; font-weight: 500; }
    .meta dd { margin: 0 0 6px; font-weight: 600; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Session expired</span>
      <h1>Time to sign in again</h1>
      <p>Hi {{user.name}}, your session on {{session.deviceLabel}} has expired for security.</p>
      <dl class="meta">
        <dt>Last active</dt><dd>{{session.lastActiveAt}}</dd>
        <dt>Reason</dt><dd>{{session.reason}}</dd>
      </dl>
      <p>No action needed unless you want to keep working — sign in again to continue:</p>
      <p><a class="button" href="{{session.signInUrl}}">Sign in</a></p>
    </div>
    <p class="footer">{{branding.name}}</p>
  </div>
</body>
</html>
