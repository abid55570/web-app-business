<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>How was your experience?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); text-align: center; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    .scale { display: inline-block; padding: 24px 12px; }
    .scale a { display: inline-block; width: 44px; height: 44px; line-height: 44px; margin: 0 3px; border-radius: 8px; text-decoration: none; font-size: 18px; background: #f4f4f5; color: #111; font-weight: 600; }
    .scale a:hover { background: {{branding.primary}}; color: #fff; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>How was your recent {{event.kind}}?</h1>
      <p>Hi {{customer.name}},</p>
      <p>{{event.summary}}</p>
      <p>One click — your rating helps us improve:</p>
      <div class="scale">
        {{#each scale.options}}
        <a href="{{this.href}}" title="{{this.label}}">{{this.emoji}}</a>
        {{/each}}
      </div>
      <p style="font-size:12px;color:#888;">Takes about 5 seconds.</p>
    </div>
    <p class="footer">{{branding.name}} · <a href="{{branding.unsubscribeUrl}}">Unsubscribe from feedback emails</a></p>
  </div>
</body>
</html>
