<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>This week at {{branding.name}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; background: #f6f7f9; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; }
    .container { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    h1 { margin: 0 0 12px; font-size: 24px; }
    .story { margin: 18px 0; padding-bottom: 18px; border-bottom: 1px solid #eee; }
    .story:last-child { border-bottom: 0; }
    .story h2 { margin: 0 0 4px; font-size: 16px; }
    .story a { color: {{branding.primary}}; text-decoration: none; }
    .button { display: inline-block; background: {{branding.primary}}; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 8px; }
    .footer { color: #888; font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>{{digest.title}}</h1>
      <p>Hi {{user.name}}, here's what's worth your time this week.</p>
      {{#each digest.stories}}
      <div class="story">
        <h2><a href="{{url}}">{{title}}</a></h2>
        <p>{{summary}}</p>
      </div>
      {{/each}}
      <a class="button" href="{{digest.archiveUrl}}">Read past digests</a>
    </div>
    <p class="footer">{{branding.name}} · <a href="{{branding.unsubscribeUrl}}">Unsubscribe</a></p>
  </div>
</body>
</html>
