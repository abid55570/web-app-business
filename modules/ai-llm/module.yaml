id: ai-llm
type: module
version: 1.0.0
displayName: "AI / LLM proxy"
description: |
  Server-side proxy to LLM providers (Anthropic, OpenAI). Single chat
  endpoint that accepts `provider` + `model` + `messages` and returns the
  raw assistant message + usage stats. Every call is logged to AILog
  for cost attribution + rate limiting.

  Per-(user, day) request cap enforced at the proxy. Production drops in
  a redis-backed limiter for cross-pod accuracy; the in-DB counter here
  is "good enough" for single-pod + low-traffic apps.

  FastAPI-only in v1 — Django adapter ships in wave 2 alongside a
  Celery-friendly background-job variant.

implements:
  - ai-llm@v1
depends_on:
  - events@v1
  - auth-core@v1

db:
  schema: ./schema.prisma

config_knobs:
  - id: daily_request_cap
    type: number
    default: 200
    description: "Per-(user, day) request cap. 0 disables limiting."
  - id: default_provider
    type: string
    default: "anthropic"
    description: "Provider used when request omits it. anthropic | openai."
  - id: default_model
    type: string
    default: "claude-3-5-sonnet-latest"
    description: "Model used when request omits it."

emits:
  - id: ai.completion
    payload:
      id:          { type: string }
      userId:      { type: string }
      provider:    { type: string }
      model:       { type: string }
      inputTokens: { type: number }
      outputTokens:{ type: number }
  - id: ai.rate-limited
    payload: { userId: { type: string }, used: { type: number }, cap: { type: number } }

backend_routers:
  - { exportName: public_router, prefix: /api,       tag: ai }
  - { exportName: admin_router,  prefix: /api/admin, tag: ai-admin }

ui_contributions:
  studio_blocks:
    - AIChatBox

permissions:
  - ai.chat

locales: [en]

env:
  - name: ANTHROPIC_API_KEY
    required: false
    description: "Required when provider=anthropic."
  - name: OPENAI_API_KEY
    required: false
    description: "Required when provider=openai."

tests:
  contract: [ai-llm@v1]
  smoke:
    - file: tests/smoke/test_ai_llm.py

deprecated: false
