id: payment-fake
type: module
version: 1.0.0
displayName: "Payment (fake)"
description: |
  Always-succeeds payment adapter implementing payment@v1. Spike + tests only.
  Real adapters (payment-stripe, payment-razorpay, ...) plug in via the same
  PaymentAdapter ABC and replace this module in production recipes.

implements:
  - payment@v1

depends_on:
  - payment-core@v1

config_knobs:
  - id: simulate_failures
    type: bool
    default: false
    description: "If true, capture/refund randomly fail (for resilience tests)."
  - id: failure_rate
    type: number
    default: 0.0
    description: "Probability (0..1) of simulated failure when simulate_failures=true."

emits:
  - id: payment.succeeded
    payload:
      intentId:      { type: string }
      transactionId: { type: string }
      amount:        { type: number }
      currency:      { type: string }
  - id: payment.failed
    payload:
      intentId: { type: string }
      reason:   { type: string }
  - id: payment.refunded
    payload:
      transactionId: { type: string }
      amount:        { type: number, optional: true }

permissions:
  - payment.refund

locales: []

env: []

tests:
  contract: [payment@v1]
  smoke:
    - file: tests/smoke/test_payment_fake.py

deprecated: false
